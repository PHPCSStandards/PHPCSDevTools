name: Test

on:
  # Run on pushes to `stable` and on all pull requests.
  push:
    branches:
      - stable
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run CI checks/tests which have no dependency on the PHPCS version used.
  test-php:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        php: ['5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    name: "Test + Lint: PHP ${{ matrix.php }} (${{ matrix.os == 'windows-latest' && 'Win' || 'Linux' }})"

    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - name: Prepare git to leave line endings alone
        run: git config --global core.autocrlf input

      - name: Checkout code
        uses: actions/checkout@v4

      # Updating the lists can fail intermittently, typically after Microsoft has released a new package.
      # This should not be blocking for this job, so ignore any errors from this step.
      # Ref: https://github.com/dotnet/core/issues/4167
      - name: Update the available packages list (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update

      - name: Install xmllint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y libxml2-utils

      - name: Install xmllint (Windows)
        if: runner.os == 'Windows'
        run: choco install xsltproc

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=-1, display_errors=On
          coverage: none
          tools: cs2pr

      # Install dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-php-dependencies-with-composer
      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v3"
        with:
          composer-options: ${{ matrix.php == '8.5' && '--ignore-platform-req=php+' || '' }}
          # Bust the cache at least once a month - output format: YYYY-MM.
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Lint against parse errors (PHP 7.2+)
        if: ${{ matrix.php >= '7.2' }}
        run: composer lint -- --checkstyle | cs2pr

      - name: Lint against parse errors (PHP < 7.2)
        if: ${{ matrix.php < '7.2' }}
        run: composer lintlt72 -- --checkstyle | cs2pr

      # Check that any sniffs available are feature complete.
      # This also acts as an integration test for the feature completeness script,
      # which is why it is run against various PHP versions and not in the "Sniff" stage.
      - name: Check for feature completeness
        run: composer check-complete

      - name: Grab PHPUnit version
        id: phpunit_version
        shell: bash
        # yamllint disable rule:line-length
        run: echo "VERSION=$(vendor/bin/phpunit --version | grep --only-matching --max-count=1 --extended-regexp '\b[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
        # yamllint enable rule:line-length

      - name: Determine PHPUnit composer script to use
        id: phpunit_script
        shell: bash
        run: |
          if [ "${{ startsWith( steps.phpunit_version.outputs.VERSION, '11.' ) }}" == "true" ]; then
            echo 'SUFFIX=' >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith( steps.phpunit_version.outputs.VERSION, '10.' ) }}" == "true" ]; then
            echo 'SUFFIX=' >> "$GITHUB_OUTPUT"
          else
            echo 'SUFFIX=-lte9' >> "$GITHUB_OUTPUT"
          fi

      - name: Run the unit tests for the DevTools
        run: composer test-tools${{ steps.phpunit_script.outputs.SUFFIX }}

  # Run CI checks/tests which have a dependency on the PHPCS version used.
  test-phpcs:
    runs-on: ubuntu-latest

    strategy:
      # Keys:
      # - experimental: Whether the build is "allowed to fail".
      matrix:
        # IMPORTANT: test runs shouldn't fail because of PHPCS being incompatible with a PHP version.
        # - PHPCS will run without errors on PHP 5.4 - 7.2 on any version.
        # - PHP 7.3 needs PHPCS 3.3.1+ to run without errors.
        # - PHP 7.4 needs PHPCS 3.5.0+ to run without errors.
        # - PHP 8.0 needs PHPCS 3.5.7+ to run without errors.
        # - PHP 8.1 needs PHPCS 3.6.1+ to run without errors.
        # - PHP 8.2 needs PHPCS 3.6.1+ to run without errors.
        # - PHP 8.3 needs PHPCS 3.8.0+ to run without errors (though the errors don't affect this package).
        # - PHP 8.4 needs PHPCS 3.8.0+ to run without errors (officially 3.11.0, but 3.8.0 will work fine).
        #
        # Additionally, PHPCS 4.x has a minimum version requirement of PHP 7.2.
        php: ['5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        phpcs_version: ['dev-master', '4.x-dev']

        exclude:
          - php: '5.4'
            phpcs_version: '4.x-dev'
          - php: '5.5'
            phpcs_version: '4.x-dev'
          - php: '5.6'
            phpcs_version: '4.x-dev'
          - php: '7.0'
            phpcs_version: '4.x-dev'
          - php: '7.1'
            phpcs_version: '4.x-dev'

        include:
          # Complete the matrix, while preventing issues with PHPCS versions incompatible with certain PHP versions.
          - php: '5.4'
            phpcs_version: '3.1.0'
          - php: '5.5'
            phpcs_version: '3.1.0'
          - php: '5.6'
            phpcs_version: '3.1.0'
          - php: '7.0'
            phpcs_version: '3.1.0'
          - php: '7.1'
            phpcs_version: '3.1.0'
          - php: '7.2'
            phpcs_version: '3.1.0'
          - php: '7.3'
            phpcs_version: '3.3.1'
          - php: '7.4'
            phpcs_version: '3.5.0'
          - php: '8.0'
            phpcs_version: '3.5.7'
          - php: '8.1'
            phpcs_version: '3.6.1'
          - php: '8.2'
            phpcs_version: '3.6.1'
          - php: '8.3'
            phpcs_version: '3.8.0'
          - php: '8.4'
            phpcs_version: '3.8.0'

    name: "Test: PHP ${{ matrix.php }} - PHPCS ${{ matrix.phpcs_version }}"

    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ini config
        id: set_ini
        run: |
          # On stable PHPCS versions, allow for PHP deprecation notices.
          # Unit tests don't need to fail on those for stable releases where those issues won't get fixed anymore.
          if [ "${{ contains( matrix.phpcs_version, 'dev' ) }}" != "true" ]; then
            echo 'PHP_INI=error_reporting=E_ALL & ~E_DEPRECATED, display_errors=On' >> "$GITHUB_OUTPUT"
          else
            echo 'PHP_INI=error_reporting=-1, display_errors=On' >> "$GITHUB_OUTPUT"
          fi

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: ${{ steps.set_ini.outputs.PHP_INI }}
          coverage: none

      - name: 'Composer: adjust dependencies'
        run: |
          # Remove the PHPCSDevCS dependency as it has different PHPCS requirements and would block installs.
          composer remove --no-update --dev phpcsstandards/phpcsdevcs --no-scripts --no-interaction
          # Set the PHPCS version to be used in the tests.
          composer require --no-update squizlabs/php_codesniffer:"${{ matrix.phpcs_version }}" --no-scripts --no-interaction

      # Install dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-php-dependencies-with-composer
      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v3"
        with:
          composer-options: ${{ matrix.php == '8.5' && '--ignore-platform-req=php+' || '' }}
          # Bust the cache at least once a month - output format: YYYY-MM.
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Grab PHPUnit version
        id: phpunit_version
        # yamllint disable rule:line-length
        run: echo "VERSION=$(vendor/bin/phpunit --version | grep --only-matching --max-count=1 --extended-regexp '\b[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
        # yamllint enable rule:line-length

      - name: Determine PHPUnit composer script to use
        id: phpunit_script
        run: |
          if [ "${{ startsWith( steps.phpunit_version.outputs.VERSION, '11.' ) }}" == "true" ]; then
            echo 'SUFFIX=' >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith( steps.phpunit_version.outputs.VERSION, '10.' ) }}" == "true" ]; then
            echo 'SUFFIX=' >> "$GITHUB_OUTPUT"
          else
            echo 'SUFFIX=-lte9' >> "$GITHUB_OUTPUT"
          fi

      - name: Run the unit tests for the PHPCSDebug sniff
        run: composer test-sniff${{ steps.phpunit_script.outputs.SUFFIX }}
